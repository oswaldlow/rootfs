name: rootfs
on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Space-separated: qqcandy pearl xaga xaga-6.18 rubens yuechu"
        default: "qqcandy"
        required: true
      distros:
        description: "Space-separated: mobian arch nura debian ubuntu fedora"
        default: "mobian arch nura"
        required: true
      ui:
        description: "User interface (nura supports console/phosh only)"
        type: choice
        options: [phosh, console, gnome, kde, kdeplasmamobile, xfce]
        default: phosh
      userspace_only:
        description: "Validate userspace only (no deployable kernel/image)"
        type: boolean
        default: false
      baseband:
        description: "Install baseband userspace; hardware startup remains gated"
        type: choice
        options: [auto, "on", "off"]
        default: auto
      publish_release:
        description: "Publish only after all selected builds succeed"
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: rootfs-${{ github.ref }}-${{ inputs.distros }}-${{ inputs.userspace_only }}-${{ inputs.ui }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ts: ${{ steps.matrix.outputs.ts }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          DEVICES: ${{ inputs.devices }}
          DISTROS: ${{ inputs.distros }}
        run: |
          python3 tools/matrix.py "$DEVICES" "$DISTROS" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.variant }} / ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: inputs.userspace_only == false
        with:
          repository: ${{ github.repository_owner }}/linux
          ref: ${{ matrix.kernel }}
          path: linux
      - name: Dependencies
        run: |
          # Third-party runner repos (packages.microsoft.com) intermittently 403.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft*.sources
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends mmdebstrap arch-test debian-archive-keyring \
            qemu-user-static binfmt-support libarchive-tools gnupg \
            e2fsprogs android-sdk-libsparse-utils pigz zstd kmod rsync \
            build-essential bc flex bison python3 multipath-tools \
            clang lld llvm binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu cpio lz4 libssl-dev libelf-dev \
            libncurses-dev dwarves git curl ca-certificates xz-utils ccache
          sudo update-binfmts --enable qemu-aarch64
          sudo arch-test arm64
          sudo git config --system --add safe.directory "$PWD/linux"
      - name: Restore ccache
        if: ${{ !inputs.userspace_only }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-rootfs-${{ matrix.device }}-${{ github.run_id }}
          restore-keys: |
            ccache-rootfs-${{ matrix.device }}-
      - name: Build
        env:
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_MAXSIZE: 4G
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
          DEVICE: ${{ matrix.device }}
          DISTRO: ${{ matrix.distro }}
          KERNEL: ${{ matrix.kernel }}
          SUFFIX: ${{ matrix.suffix }}
          UI: ${{ inputs.ui }}
          USERSPACE_ONLY: ${{ inputs.userspace_only }}
          BASEBAND: ${{ inputs.baseband }}
          TS: ${{ needs.prepare.outputs.ts }}
        run: |
          set -euo pipefail
          args=(--device "$DEVICE" --distro "$DISTRO" --ui "$UI" --baseband "$BASEBAND"
                --ts "$TS" --out "$PWD/out" --jobs "$(nproc)" --tar)
          if [ "$USERSPACE_ONLY" = true ]; then
            args+=(--rootfs-only)
          else
            args+=(--kernel-repo "$PWD/linux" --kernel-ref "$KERNEL")
          fi
          [ -z "$SUFFIX" ] || args+=(--name-suffix "$SUFFIX")
          # LLVM=1 calls clang by name, so put a ccache wrapper first in PATH
          # (the same as CC="ccache clang", which build.sh cannot pass through
          # its unquoted make arguments).  build.sh points ccache at its
          # per-run kernel directory.
          mkdir -p "$RUNNER_TEMP/ccbin" "$CCACHE_DIR"
          printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(command -v clang)" > "$RUNNER_TEMP/ccbin/clang"
          chmod +x "$RUNNER_TEMP/ccbin/clang"
          ccache -z
          ccenv=(PATH="$RUNNER_TEMP/ccbin:$PATH" CCACHE_DIR="$CCACHE_DIR"
                 CCACHE_MAXSIZE="$CCACHE_MAXSIZE" CCACHE_COMPILERCHECK="$CCACHE_COMPILERCHECK"
                 CCACHE_SLOPPINESS="$CCACHE_SLOPPINESS" KBUILD_BUILD_TIMESTAMP=2026-01-01
                 KBUILD_BUILD_USER=mt6895 KBUILD_BUILD_HOST=ci)
          sudo -E env "${ccenv[@]}" bash ./build.sh "${args[@]}"
          cd out
          sha256sum -c SHA256SUMS
      - name: ccache statistics
        if: ${{ always() && !inputs.userspace_only }}
        env:
          CCACHE_DIR: /home/runner/.cache/ccache
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$CCACHE_DIR" 2>/dev/null || true
          ccache -s || true
      - name: Save ccache
        if: ${{ always() && !inputs.userspace_only }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-rootfs-${{ matrix.device }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.variant }}-${{ matrix.distro }}-${{ inputs.ui }}
          path: out/*
          if-no-files-found: error
  release:
    needs: [prepare, build]
    if: inputs.publish_release && !inputs.userspace_only
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rootfs-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
            sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ needs.prepare.outputs.ts }}
          draft: true
          files: release/*
          body: |
            Matching Image, DTB, rootfs and kernel modules.
            User interface: ${{ inputs.ui }} (non-phosh images carry the UI in their names).
            No extracted vendor firmware or modem NVRAM is injected.
            Default local user PIN: 1234. Root and SSH password login are disabled.
            Build success is not device boot/IMS/VCP hardware validation.
